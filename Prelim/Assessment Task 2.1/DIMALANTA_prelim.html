<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prelim Grade Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 60px 20px;
    background: #faf6f4;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #4a3f3d;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #fffdfc;
    padding: 40px 36px;
    border: 1px solid #eadfda;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #b0616f;
    margin: 0 0 4px;
  }
  .sub {
    font-size: 12px;
    color: #a89a95;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 13px;
    margin: 14px 0 6px;
    color: #6b5b57;
  }
  input {
    width: 100%;
    padding: 8px 10px;
    border: none;
    border-bottom: 1px solid #e2d2cd;
    background: transparent;
    font-size: 14px;
    color: #4a3f3d;
    outline: none;
  }
  input:focus {
    border-bottom: 1px solid #b0616f;
  }
  .row {
    display: flex;
    gap: 14px;
  }
  .row > div {
    flex: 1;
  }
  button {
    margin-top: 30px;
    width: 100%;
    padding: 11px;
    background: #b0616f;
    color: #fff;
    border: none;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
  }
  button:hover {
    background: #98505d;
  }
  .result {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid #eadfda;
    text-align: center;
    display: none;
  }
  .result span {
    display: block;
    font-size: 12px;
    color: #a89a95;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .result strong {
    font-size: 32px;
    color: #b0616f;
    font-weight: 600;
  }
  .next {
    display: none;
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
  }
  .next a {
    color: #b0616f;
    text-decoration: none;
    border-bottom: 1px solid #b0616f;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Prelim</h1>
  <div class="sub">grade computation</div>

  <label>Quizzes</label>
  <div class="row">
    <div><input type="number" id="q1" placeholder="Quiz 1"></div>
    <div><input type="number" id="q2" placeholder="Quiz 2"></div>
    <div><input type="number" id="q3" placeholder="Quiz 3"></div>
  </div>

  <label>Laboratory Activities</label>
  <div class="row">
    <div><input type="number" id="l1" placeholder="Lab 1"></div>
    <div><input type="number" id="l2" placeholder="Lab 2"></div>
    <div><input type="number" id="l3" placeholder="Lab 3"></div>
  </div>

  <label>Assignments</label>
  <div class="row">
    <div><input type="number" id="a1" placeholder="Assignment 1"></div>
    <div><input type="number" id="a2" placeholder="Assignment 2"></div>
  </div>

  <label>Prelim Exam</label>
  <input type="number" id="pe" placeholder="Score">

  <button onclick="computePrelim()">Compute</button>

  <div class="result" id="result">
    <span>Prelim Grade</span>
    <strong id="pgValue">0</strong>
  </div>

  <div class="next" id="next">
    saved — continue to <a href="midterm.html">midterm</a>
  </div>
</div>

<script>

function computePrelim() {
  const q = (num("q1") + num("q2") + num("q3")) / 3;
  const l = (num("l1") + num("l2") + num("l3")) / 3;
  const a = (num("a1") + num("a2")) / 2;
  const pe = num("pe");

  const cs = (q * 0.6) + (a * 0.2) + (l * 0.2);
  const pg = (cs * 0.5) + (pe * 0.5);

  document.getElementById("pgValue").textContent = pg.toFixed(1);
  document.getElementById("result").style.display = "block";
  document.getElementById("next").style.display = "block";

  localStorage.setItem("prelimGrade", pg.toFixed(2));
}

function num(id) {
  const v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? 0 : v;
}
</script>
</body>
</html>
