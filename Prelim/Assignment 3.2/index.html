<!DOCTYPE html>
<head>
<title>Day Checker</title>
</style>
</head>
<body>
<script>
function checkDay() {
  var num = prompt("Enter a number:");
  num = parseInt(num);

  switch (num) {
    case 1:
      alert("Today is Monday");
      break;
    case 2:
      alert("Today is Tuesday");
      break;
    case 3:
      alert("Today is Wednesday");
      break;
    case 4:
      alert("Today is Thursday");
      break;
    case 5:
      alert("Today is Friday");
      break;
    case 6:
      alert("Today is Saturday");
      break;
    case 7:
      alert("Today is Sunday");
      break;
    default:
      showLovePattern();
      openMemberWindow();
      break;
  }
}

function showLovePattern() {
  var pattern = "";
  for (var i = 1; i <= 10; i++) {
    for (var j = 1; j <= i; j++) {
      pattern += "*";
    }
    pattern += "\n";
  }
  alert("I LOVE YOU\n\n" + pattern);
}

function openMemberWindow() {
  var myWindow = window.open("", "", "width=500, height=500");
  myWindow.document.write("<table border='1' width='100%' height='100%'>");
  myWindow.document.write("<tr><td><img src='1000056588.jpeg' width='100%' height='100%'></td><td><img src='seanpic.jpg' width='100%' height='100%'></td></tr>");
  myWindow.document.write("<tr><td><img src='ayeshapic.jpg' width='100%' height='100%'></td><td><img src='exeveapic.png' width='100%' height='100%'></td></tr>");
  myWindow.document.write("<tr><td colspan='2'><img src='jmpic.jpg' width='100%' height='100%'></td></tr>");
  myWindow.document.write("</table>");
  myWindow.blur();
}

checkDay();
</script>
</body>
</html>
